apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels:
    istio-injection: enabled
---
# server: httpbin (mesh)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: httpbin-sa
  namespace: shop
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: shop
  labels: { app: httpbin }
spec:
  selector: { app: httpbin }
  ports:
    - { name: http, port: 8000, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: shop
spec:
  replicas: 1
  selector: { matchLabels: { app: httpbin } }
  template:
    metadata:
      labels: { app: httpbin }
    spec:
      serviceAccountName: httpbin-sa
      containers:
        - name: httpbin
          image: docker.io/kennethreitz/httpbin
          ports: [{ containerPort: 80 }]
---
# client #1: cart (mesh, allowed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cart-sa
  namespace: shop
---
apiVersion: v1
kind: Pod
metadata:
  name: cart
  namespace: shop
  labels: { app: cart }
spec:
  serviceAccountName: cart-sa
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "infinity"]
---
# client #2: attacker (mesh, will be denied by AuthZ)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: attacker-sa
  namespace: shop
---
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: shop
  labels: { app: attacker }
spec:
  serviceAccountName: attacker-sa
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "infinity"]
---
# client #3: outsider (no sidecar, no mTLS)
apiVersion: v1
kind: Namespace
metadata:
  name: outside
---
apiVersion: v1
kind: Pod
metadata:
  name: outsider
  namespace: outside
  labels: { app: outsider }
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command: ["sleep", "infinity"]
