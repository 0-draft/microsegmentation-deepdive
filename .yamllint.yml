extends: default

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false  # GitHub Actions uses `on:` which yamllint flags
  comments:
    min-spaces-from-content: 1
  braces:
    max-spaces-inside: 1
  indentation:
    spaces: 2
    indent-sequences: consistent
    check-multi-line-strings: false

ignore: |
  **/.terraform/
  **/expected/
