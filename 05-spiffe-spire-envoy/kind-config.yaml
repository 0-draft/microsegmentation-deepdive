kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ms-05-spire
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            service-account-issuer: api
            service-account-jwks-uri: https://kubernetes.default.svc.cluster.local/openid/v1/jwks
